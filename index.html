<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcons Play Plotter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; max-width: 800px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      position: relative;
    }

    /* Top Navigation / Context Menu Styles */
    .menu-container {
      position: relative;
    }

    .menu-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 110%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      min-width: 160px;
      z-index: 100;
      overflow: hidden;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      background: none;
      border: none;
      color: var(--text);
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: #334155;
    }

    .dropdown-item.danger {
      color: #f87171;
    }

    /* Application Layout */
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    select, input {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .btn {
      background: var(--primary);
      color: var(--text);
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .card.active {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.15);
    }

    .card.disabled {
      opacity: 0.4;
      border-color: var(--danger);
      text-decoration: line-through;
    }

    .card .number { font-size: 1.2rem; font-weight: bold; }
    .card .name { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .card .count { font-size: 0.85rem; font-weight: 600; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2>Falcons Play Plotter</h2>
      <small id="status" style="color: var(--muted);">Ready</small>
    </div>

    <!-- Top Right Context Menu -->
    <div class="menu-container">
      <button class="menu-btn" onclick="toggleMenu(event)">⚙️ Menu ▾</button>
      <div class="dropdown-menu" id="contextMenu">
        <button class="dropdown-item" onclick="toggleEditMode()">✏️ Edit Roster</button>
        <button class="dropdown-item" onclick="syncData()">🔄 Sync Data</button>
        <a class="dropdown-item" href="review.html" target="_blank" onclick="closeMenu()">📊 Review Page</a>
        <button class="dropdown-item danger" onclick="resetGameData()">⚠️ Reset Game</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="Your Name/Initials" style="flex: 1;" />
    <select id="gameSelect" style="flex: 1;"></select>
    <button class="btn" onclick="recordPlay()">+ Log Play</button>
  </div>

  <div class="grid" id="rosterGrid"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBnOdXnFSSCFWcXUftqKx-NbXIErBvwb1oxuECjrzAX7HgMzxUNKk7VhVtK6a0cY8/exec";

    const roster = [
      "#1 Sam James", "#2 Mikai Rios", "#3 Chase Daniel", "#4 Riley Lesperance",
      "#5 August Mandulak", "#6 Will Parker", "#8 Thoreson Edwards", "#9 Conan Iakopo",
      "#11 Jaren Taitano", "#13 Toby Fejaran", "#14 Jibreel Gonzalez", "#15 Cruz Nichols",
      "#18 Samuel Thomas", "#23 Donovan Schade-Graeber", "#25 Gavin Kortyka",
      "#32 Darian Gonzalez Montez", "#33 Jacob Rule", "#40 Jason McIntosh-Barela",
      "#42 Julian Avila", "#44 Alonzo Gray", "#45 Colt Kragerud", "#50 Daniel Moreno Olivares",
      "#54 Brayden Steinmetz", "#61 Roman Parker-McKenna", "#63 Cayden Lemay",
      "#66 Alvaro Gonzalez-Alcala", "#72 Huck Holscher", "#77 Calvin Brennan",
      "#80 Kaine Chacon", "#82 Preston Zucco", "#92 Forest Jolliffe", "#99 Hayden Santangelo"
    ];

    let activePlayers = new Set();
    let editMode = false;

    function toggleMenu(event) {
      event.stopPropagation();
      document.getElementById("contextMenu").classList.toggle("show");
    }

    function closeMenu() {
      document.getElementById("contextMenu").classList.remove("show");
    }

    // Close menu when clicking anywhere else on the screen
    window.addEventListener("click", () => closeMenu());

    function toggleEditMode() {
      closeMenu();
      editMode = !editMode;
      alert(editMode ? "Edit Mode ON: Click players to mark them OUT." : "Edit Mode OFF.");
      renderRoster();
    }

    function syncData() {
      closeMenu();
      document.getElementById("status").innerText = "Syncing with cloud...";
      setTimeout(() => {
        document.getElementById("status").innerText = "Synced";
      }, 1000);
    }

    function resetGameData() {
      closeMenu();
      if (confirm("Are you sure you want to reset all play counts for this game locally?")) {
        activePlayers.clear();
        renderRoster();
        document.getElementById("status").innerText = "Game reset locally.";
      }
    }

    function renderRoster() {
      const grid = document.getElementById("rosterGrid");
      if (!grid) return;
      
      grid.innerHTML = "";

      roster.forEach(player => {
        const card = document.createElement("div");
        card.className = `card ${activePlayers.has(player) ? 'active' : ''}`;
        card.onclick = () => {
          if (activePlayers.has(player)) {
            activePlayers.delete(player);
          } else {
            activePlayers.add(player);
          }
          renderRoster();
        };

        const parts = player.split(" ");
        const num = parts[0];
        const name = parts.slice(1).join(" ");

        card.innerHTML = `
          <div class="number">${num}</div>
          <div class="name">${name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function recordPlay() {
      const user = document.getElementById("userInput").value.trim();
      if (!user) {
        alert("Please enter your name/initials before logging plays.");
        return;
      }
      if (activePlayers.size === 0) {
        alert("Select active players on the field first.");
        return;
      }

      document.getElementById("status").innerText = `Logged play with ${activePlayers.size} players.`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderRoster();
    });
  </script>
</body>
</html>
