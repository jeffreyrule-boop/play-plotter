<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liberty Falcons Play Plotter</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 0; background: #f0f2f5; color: #1c1e21; padding-bottom: 20px; }
    
    .header { position: sticky; top: 0; background: #1a365d; color: white; padding: 8px 12px; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 16px; font-weight: bold; }
    .sub-title { font-size: 12px; color: #cbd5e0; }
    
    .qtr-selector { display: flex; gap: 4px; margin-top: 6px; }
    .qtr-btn { flex: 1; padding: 4px; background: #2d3748; color: white; border: 1px solid #4a5568; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
    .qtr-btn.active { background: #3182ce; border-color: #63b3ed; }

    .sticky-actions { position: sticky; top: 76px; background: #edf2f7; padding: 6px 12px; z-index: 99; border-bottom: 1px solid #cbd5e0; display: flex; gap: 6px; }
    .btn-lock { flex: 2; padding: 10px; background: #2b6cb0; color: white; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-align: center; }
    .btn-sync { flex: 1; padding: 10px; background: #2f855a; color: white; font-size: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .btn-reset { padding: 10px 12px; background: #e53e3e; color: white; font-size: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }

    /* 2-Column Grid Layout for Compact Sideline View */
    .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px 12px; }
    .player-chip { display: flex; align-items: center; justify-content: space-between; background: white; padding: 6px 8px; border-radius: 6px; border: 1.5px solid #cbd5e0; font-size: 12px; font-weight: bold; user-select: none; cursor: pointer; min-height: 38px; }
    .player-chip.selected { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; box-shadow: inset 0 0 0 1px #3182ce; }
    .player-chip.met { background: #f0fff4; border-color: #38a169; }
    .player-chip.met.selected { background: #c6f6d5; border-color: #276749; color: #22543d; }
    
    .chip-info { display: flex; flex-direction: column; overflow: hidden; }
    .chip-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
    .chip-badge { font-size: 10px; font-weight: normal; color: #718096; margin-top: 1px; }
    .player-chip.selected .chip-badge { color: #2b6cb0; }
    .player-chip.met .chip-badge { color: #276749; font-weight: bold; }
    
    .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #cbd5e0; flex-shrink: 0; }
    .player-chip.selected .status-dot { background: #3182ce; border-color: #2b6cb0; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="title">Liberty Falcons Plotter</div>
      <div class="sub-title" id="playCountHeader">Play #1 • On Field: 0 / 11</div>
    </div>
    <div class="qtr-selector">
      <div class="qtr-btn active" onclick="setQtr(1)">Q1</div>
      <div class="qtr-btn" onclick="setQtr(2)">Q2</div>
      <div class="qtr-btn" onclick="setQtr(3)">Q3</div>
      <div class="qtr-btn" onclick="setQtr(4)">Q4</div>
    </div>
  </div>

  <div class="sticky-actions">
    <button class="btn-lock" onclick="lockInPlay()">LOCK IN PLAY <span id="btnPlayNum">1</span></button>
    <button class="btn-sync" onclick="syncToGoogleSheet()">Sync</button>
    <button class="btn-reset" onclick="resetGame()">Reset</button>
  </div>

  <div class="player-grid" id="playerGrid"></div>

  <script>
    const roster = [
      "#1 Sam James", "#2 Mikai Rios", "#3 Chase Daniel", "#4 Riley Lesperance",
      "#5 August Mandulak", "#6 Will Parker", "#8 Thoreson Edwards", "#9 Conan Iakopo",
      "#11 Jaren Taitano", "#13 Toby Fejaran", "#14 Jibreel Gonzalez", "#15 Cruz Nichols",
      "#18 Samuel Thomas", "#23 Donovan Schade-Graeber", "#25 Gavin Kortyka",
      "#32 Darian Gonzalez Montez", "#33 Jacob Rule", "#40 Jason McIntosh-Barela",
      "#42 Julian Avila", "#44 Alonzo Gray", "#45 Colt Kragerud", "#50 Daniel Moreno Olivares",
      "#54 Brayden Steinmetz", "#61 Roman Parker-McKenna", "#63 Cayden Lemay",
      "#72 Huck Holscher", "#77 Calvin Brennan", "#80 Kaine Chacon", "#82 Preston Zucco",
      "#92 Forest Jolliffe", "#99 Hayden Santangelo", "#66 Alvaro Gonzalez-Alcala"
    ];

    let currentQtr = 1;
    let playNumber = 1;
    let activePlayers = new Set();
    let playHistory = [];
    let playerStats = roster.reduce((acc, name) => { acc[name] = { total: 0, qtrMet: null }; return acc; }, {});

    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    function saveToLocalStorage() {
      const data = { currentQtr, playNumber, activePlayers: Array.from(activePlayers), playHistory, playerStats };
      localStorage.setItem("falcons_play_plotter_data", JSON.stringify(data));
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem("falcons_play_plotter_data");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currentQtr = parsed.currentQtr || 1;
          playNumber = parsed.playNumber || 1;
          activePlayers = new Set(parsed.activePlayers || []);
          playHistory = parsed.playHistory || [];
          playerStats = parsed.playerStats || playerStats;
          
          document.querySelectorAll(".qtr-btn").forEach((btn, idx) => {
            btn.classList.toggle("active", idx + 1 === currentQtr);
          });
        } catch (e) { console.error(e); }
      }
    }

    function resetGame() {
      if (confirm("Reset current game data?")) {
        localStorage.removeItem("falcons_play_plotter_data");
        location.reload();
      }
    }

    function render() {
      const gridEl = document.getElementById("playerGrid");
      gridEl.innerHTML = "";
      document.getElementById("playCountHeader").innerText = `Play #${playNumber} • On Field: ${activePlayers.size} / 11`;
      document.getElementById("btnPlayNum").innerText = playNumber;

      roster.forEach(name => {
        const stats = playerStats[name];
        const isSelected = activePlayers.has(name);
        const isMet = stats.total >= 10;

        const chip = document.createElement("div");
        chip.className = `player-chip ${isSelected ? 'selected' : ''} ${isMet ? 'met' : ''}`;
        chip.onclick = () => togglePlayer(name);

        chip.innerHTML = `
          <div class="chip-info">
            <span class="chip-name">${name}</span>
            <span class="chip-badge">${isMet ? `Met (${stats.qtrMet})` : `Plays: ${stats.total}`}</span>
          </div>
          <div class="status-dot"></div>
        `;
        gridEl.appendChild(chip);
      });
    }

    function togglePlayer(name) {
      if (activePlayers.has(name)) { activePlayers.delete(name); } 
      else { activePlayers.add(name); }
      saveToLocalStorage();
      render();
    }

    function setQtr(q) {
      currentQtr = q;
      document.querySelectorAll(".qtr-btn").forEach((btn, idx) => { btn.classList.toggle("active", idx + 1 === q); });
      saveToLocalStorage();
    }

    function lockInPlay() {
      if (activePlayers.size === 0) { alert("Select active players first!"); return; }

      playHistory.push({ play: playNumber, quarter: currentQtr, players: Array.from(activePlayers) });

      activePlayers.forEach(name => {
        playerStats[name].total += 1;
        if (playerStats[name].total >= 10 && !playerStats[name].qtrMet) {
          playerStats[name].qtrMet = `Q${currentQtr}`;
        }
      });

      playNumber++;
      saveToLocalStorage();
      render();
    }

    async function syncToGoogleSheet() {
      if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        alert("Paste your Google Apps Script Web App URL into line 103 (SCRIPT_URL).");
        return;
      }
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ playHistory: playHistory })
        });
        alert("Synced play history to Google Sheet!");
      } catch (err) {
        alert("Error syncing: " + err.message);
      }
    }

    loadFromLocalStorage();
    render();
  </script>
</body>
</html>
