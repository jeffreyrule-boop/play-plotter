<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBnOdXnFSSCFWcXUftqKx-NbXIErBvwb1oxuECjrzAX7HgMzxUNKk7VhVtK6a0cY8/exec";

  const roster = [
    "#1 Sam James", "#2 Mikai Rios", "#3 Chase Daniel", "#4 Riley Lesperance",
    "#5 August Mandulak", "#6 Will Parker", "#8 Thoreson Edwards", "#9 Conan Iakopo",
    "#11 Jaren Taitano", "#13 Toby Fejaran", "#14 Jibreel Gonzalez", "#15 Cruz Nichols",
    "#18 Samuel Thomas", "#23 Donovan Schade-Graeber", "#25 Gavin Kortyka",
    "#32 Darian Gonzalez Montez", "#33 Jacob Rule", "#40 Jason McIntosh-Barela",
    "#42 Julian Avila", "#44 Alonzo Gray", "#45 Colt Kragerud", "#50 Daniel Moreno Olivares",
    "#54 Brayden Steinmetz", "#61 Roman Parker-McKenna", "#63 Cayden Lemay",
    "#66 Alvaro Gonzalez-Alcala", "#72 Huck Holscher", "#77 Calvin Brennan",
    "#80 Kaine Chacon", "#82 Preston Zucco", "#92 Forest Jolliffe", "#99 Hayden Santangelo"
  ];

  let rawLogEntries = [];
  let availableGames = [];
  let userStates = {};

  // Sort State - Defaults to Player (Jersey Number) Ascending
  let sortColumn = "name"; 
  let sortDirection = "asc";

  async function fetchLogData() {
    document.getElementById("lastUpdated").innerText = "Fetching live entries...";
    try {
      const response = await fetch(SCRIPT_URL);
      const data = await response.json();

      if (data.error) {
        alert("Error: " + data.error);
        return;
      }

      rawLogEntries = data.logEntries || [];
      availableGames = data.games || [];

      document.getElementById("lastUpdated").innerText = "Updated: " + data.lastUpdated;
      
      populateGameSelect();
      render();
    } catch (err) {
      document.getElementById("lastUpdated").innerText = "Error loading logs.";
      console.error(err);
    }
  }

  function populateGameSelect() {
    const select = document.getElementById("gameSelect");
    select.innerHTML = "";

    if (availableGames.length === 0) {
      select.innerHTML = "<option>No games recorded</option>";
      return;
    }

    availableGames.forEach((game, idx) => {
      const opt = document.createElement("option");
      opt.value = game;
      opt.innerText = game;
      if (idx === availableGames.length - 1) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function toggleUser(username) {
    userStates[username] = !userStates[username];
    renderUserPills();
    render();
  }

  function renderUserPills() {
    const container = document.getElementById("userPills");
    container.innerHTML = "";

    Object.keys(userStates).forEach(user => {
      const isEnabled = userStates[user];
      const pill = document.createElement("div");
      pill.className = `user-pill ${isEnabled ? 'active' : 'disabled'}`;
      pill.onclick = () => toggleUser(user);
      pill.innerHTML = `${isEnabled ? '✓' : '✗'} ${user}`;
      container.appendChild(pill);
    });
  }

  function setSort(colKey) {
    if (sortColumn === colKey) {
      sortDirection = sortDirection === "asc" ? "desc" : "asc";
    } else {
      sortColumn = colKey;
      sortDirection = colKey === "name" ? "asc" : "desc";
    }
    render();
  }

  function getSortIndicator(colKey) {
    if (sortColumn !== colKey) return " ↕";
    return sortDirection === "asc" ? " ▲" : " ▼";
  }

  function render() {
    const selectedGame = document.getElementById("gameSelect").value;
    if (!selectedGame) return;

    const gameEntries = rawLogEntries.filter(e => e.game === selectedGame);
    const gamePlotters = Array.from(new Set(gameEntries.map(e => e.user).filter(Boolean)));
    
    gamePlotters.forEach(u => {
      if (userStates[u] === undefined) userStates[u] = true;
    });

    renderUserPills();

    const enabledPlotters = gamePlotters.filter(u => userStates[u]);

    const userPlayerCounts = {};
    const playerDisabledStatus = {};

    enabledPlotters.forEach(u => { userPlayerCounts[u] = {}; });

    gameEntries.forEach(entry => {
      const u = entry.user;
      if (!userStates[u]) return;

      if (entry.type === "PLAY" && entry.activePlayers) {
        entry.activePlayers.forEach(p => {
          userPlayerCounts[u][p] = (userPlayerCounts[u][p] || 0) + 1;
        });
      } else if (entry.type === "MANUAL_ADJUSTMENT" && entry.targetPlayer) {
        if (entry.newValue !== undefined) {
          userPlayerCounts[u][entry.targetPlayer] = entry.newValue;
        }
      } else if (entry.type === "PLAYER_DISABLED" && entry.targetPlayer) {
        playerDisabledStatus[entry.targetPlayer] = true;
      }
    });

    let tableData = roster.map(name => {
      let maxSnaps = 0;
      let userCounts = {};

      enabledPlotters.forEach(u => {
        const count = userPlayerCounts[u][name] || 0;
        userCounts[u] = count;
        if (count > maxSnaps) maxSnaps = count;
      });

      // Parse numerical jersey value from '#12 Name' format
      const numMatch = name.match(/#(\d+)/);
      const jerseyNum = numMatch ? parseInt(numMatch[1], 10) : 999;

      return {
        name,
        jerseyNum,
        userCounts,
        maxSnaps,
        isOut: !!playerDisabledStatus[name],
        isMet: maxSnaps >= 10
      };
    });

    // Execute sorting
    tableData.sort((a, b) => {
      let valA, valB;

      if (sortColumn === "name") {
        valA = a.jerseyNum;
        valB = b.jerseyNum;
      } else if (sortColumn === "maxSnaps") {
        valA = a.maxSnaps;
        valB = b.maxSnaps;
      } else if (sortColumn === "status") {
        valA = a.isOut ? 0 : (a.isMet ? 2 : 1);
        valB = b.isOut ? 0 : (b.isMet ? 2 : 1);
      } else if (sortColumn.startsWith("user_")) {
        const userKey = sortColumn.replace("user_", "");
        valA = a.userCounts[userKey] || 0;
        valB = b.userCounts[userKey] || 0;
      }

      if (valA < valB) return sortDirection === "asc" ? -1 : 1;
      if (valA > valB) return sortDirection === "asc" ? 1 : -1;
      return 0;
    });

    // Header rendering
    const headerRow = document.getElementById("tableHeader");
    let headerHTML = `<tr>
      <th class="${sortColumn === 'name' ? 'sorted' : ''}" onclick="setSort('name')">Player${getSortIndicator('name')}</th>`;
    
    enabledPlotters.forEach(u => {
      const colKey = `user_${u}`;
      headerHTML += `<th class="${sortColumn === colKey ? 'sorted' : ''}" onclick="setSort('${colKey}')">${u}${getSortIndicator(colKey)}</th>`;
    });

    headerHTML += `
      <th class="${sortColumn === 'maxSnaps' ? 'sorted' : ''}" onclick="setSort('maxSnaps')">Max Snaps${getSortIndicator('maxSnaps')}</th>
      <th class="${sortColumn === 'status' ? 'sorted' : ''}" onclick="setSort('status')">Requirement${getSortIndicator('status')}</th>
    </tr>`;
    headerRow.innerHTML = headerHTML;

    // Body rendering
    const tbody = document.getElementById("rosterTable");
    tbody.innerHTML = "";

    tableData.forEach(row => {
      let countsHTML = "";

      enabledPlotters.forEach(u => {
        countsHTML += `<td>${row.userCounts[u] || 0}</td>`;
      });

      let statusBadge = "";
      if (row.isOut) {
        statusBadge = `<span class="badge badge-out">OUT</span>`;
      } else if (row.isMet) {
        statusBadge = `<span class="badge badge-met">✓ Met (10+)</span>`;
      } else {
        statusBadge = `<span class="badge badge-unmet">Needs ${10 - row.maxSnaps} more</span>`;
      }

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><strong>${row.name}</strong></td>
        ${countsHTML}
        <td><strong>${row.maxSnaps}</strong></td>
        <td>${statusBadge}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  fetchLogData();
</script>
